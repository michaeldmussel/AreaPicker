[package]
name = "area_clicker"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
rand = "0.8"
once_cell = "1"
parking_lot = "0.12"
enigo = "0.1"
rdev = { version = "0.5", optional = true }
winit = "0.29"
display-info = "0.4"
clap = { version = "4.5.47", features = ["derive"] }

# Screen capture for the area picker's "show what's under the picker" preview.
# xcap's Linux backend needs pipewire dev headers that aren't available in every
# build environment; the app is Windows-targeted (enigo/winit usage assumes it),
# so this dependency is restricted to Windows to keep the build portable.
[target.'cfg(windows)'.dependencies]
xcap = "0.9"

[features]
hooks = ["rdev"]
